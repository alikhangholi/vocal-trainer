name: Build APK

on:
  push:
  workflow_dispatch:   # lets you trigger a build manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest   # GitHub's Linux runner already has the Android SDK
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        # Compiler errors are re-emitted as workflow annotations. Run logs need admin rights to
        # download, but annotations are readable by anyone who can see the repo - so a failed
        # build says *what* broke without anyone having to open the log.
        run: |
          set +e   # the step runs under `bash -e`; we need to survive the failure to report it
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            grep -E '^(e:|w: .*error)|error:|FAILURE:|Caused by:' build.log | head -60 \
              | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit $code

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: betterpitch-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Everything below is skipped until the signing secrets exist, so the debug build never
      # goes red just because the keystore hasn't been added yet. The check has to happen inside
      # the script: the `secrets` context isn't available in a step-level `if`, and referencing it
      # there makes Actions reject the whole workflow.
      - name: Decode keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/betterpitch.jks"
            echo "path=$RUNNER_TEMP/betterpitch.jks" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        if: steps.keystore.outputs.path != ''
        run: gradle assembleRelease --no-daemon --stacktrace
        env:
          # Read by the `secret(...)` helper in app/build.gradle.kts. Passed as environment
          # variables rather than -P flags so nothing lands in a process listing.
          KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload release APK
        if: steps.keystore.outputs.path != ''
        uses: actions/upload-artifact@v4
        with:
          name: betterpitch-release-apk
          path: app/build/outputs/apk/release/app-release.apk
